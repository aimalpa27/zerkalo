name: Cycle 59 docs finalizer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cycle59-docs.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepend Cycle 59 changelog and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG_PLAIT.md')
          old = path.read_text(encoding='utf-8')
          entry = '''# CHANGELOG_PLAIT.md

## 2026-09-20 — Cycle 59

### Что изменено
- Закрыт внутренний P0 full regression gate: CI #108 подтвердил critical lifecycle 14/14 и полный backend suite 219/219.
- Подтверждены Django check, migration drift check, migrations, Redis/Channels runtime, frontend npm ci/typecheck/build.
- Guest/Admin/Manager/Waiter/Kitchen/Owner permissions, CRUD/realtime/payment boundaries не ослаблялись.
- AI_ENABLED=false; внешние AI API не подключались.
- Выполнена попытка перейти к следующему P0 — публичному ASGI runtime. Railway provisioning заблокирован состоянием аккаунта: trial expired; production code не менялся ради обхода billing.

### Проверка
- QR → menu → cart → order → admin → kitchen → ready → waiter → served → close → Owner Analytics: PASS.
- Critical regression: 14/14 PASS.
- Full backend suite: 219/219 PASS.
- Frontend typecheck/build: PASS.
- Следующий acceptance gate: публичные /health/live + /health/ready, HTTPS/WSS и mobile smoke после provisioning PostgreSQL + Redis + ASGI host.

'''
          if old.startswith('# CHANGELOG_PLAIT.md\n'):
              old = old[len('# CHANGELOG_PLAIT.md\n'):].lstrip('\n')
          path.write_text(entry + old, encoding='utf-8')
          PY
          rm .github/workflows/cycle59-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG_PLAIT.md .github/workflows/cycle59-docs.yml
          git commit -m 'docs: record Cycle 59 verified P0 gate'
          git push
