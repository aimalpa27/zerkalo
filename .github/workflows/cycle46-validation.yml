name: Plait Cycle 47 P0 Validation
on:
  push:
    paths:
      - '.github/workflows/cycle46-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AI_ENABLED: 'false'
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-cycle47-secret
      DEBUG: 'True'
      DATABASE_URL: sqlite:///ci-cycle47.sqlite3
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Verify Redis dependency
        working-directory: backend
        run: python -c "import redis; r=redis.Redis.from_url('redis://127.0.0.1:6379/0'); assert r.ping()"
      - name: Django checks and migrations
        working-directory: backend
        run: |
          python manage.py check
          python manage.py migrate --noinput
      - name: P0 QR to analytics + roles + realtime regression
        working-directory: backend
        run: |
          python manage.py test apps.sessions.tests.FullRestaurantRegressionFlowTest apps.sessions.tests.KitchenLeastPrivilegeTests apps.websocket.tests.WebsocketTenantIsolationTests -v 2
      - name: Backend regression suite
        working-directory: backend
        run: python manage.py test apps.users apps.restaurants apps.menu apps.tables apps.sessions apps.calls apps.analytics apps.websocket -v 1
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
