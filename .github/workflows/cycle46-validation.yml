name: Plait Cycle 48 P0 Validation
on:
  push:
    paths:
      - '.github/workflows/cycle46-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AI_ENABLED: 'false'
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-cycle48-secret
      DEBUG: 'True'
      DATABASE_URL: sqlite:///ci-cycle48.sqlite3
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Verify Redis dependency
        working-directory: backend
        run: python -c "import redis; r=redis.Redis.from_url('redis://127.0.0.1:6379/0'); assert r.ping()"
      - name: Django checks and migrations
        id: django_gate
        continue-on-error: true
        working-directory: backend
        run: |
          set -o pipefail
          : > ../cycle48-diagnostics.txt
          echo '=== manage.py check ===' | tee -a ../cycle48-diagnostics.txt
          python manage.py check 2>&1 | tee -a ../cycle48-diagnostics.txt
          CHECK=${PIPESTATUS[0]}
          echo '=== migrate ===' | tee -a ../cycle48-diagnostics.txt
          python manage.py migrate --noinput 2>&1 | tee -a ../cycle48-diagnostics.txt
          MIGRATE=${PIPESTATUS[0]}
          echo "check_exit=$CHECK migrate_exit=$MIGRATE" | tee -a ../cycle48-diagnostics.txt
          test "$CHECK" -eq 0 -a "$MIGRATE" -eq 0
      - name: Upload Django diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle48-diagnostics
          path: cycle48-diagnostics.txt
      - name: Stop if Django gate failed
        if: steps.django_gate.outcome != 'success'
        run: exit 1
      - name: P0 QR to analytics + roles + realtime regression
        working-directory: backend
        run: |
          python manage.py test apps.sessions.tests.FullRestaurantRegressionFlowTest apps.sessions.tests.KitchenLeastPrivilegeTests apps.websocket.tests.WebsocketTenantIsolationTests -v 2
      - name: Backend regression suite
        working-directory: backend
        run: python manage.py test apps.users apps.restaurants apps.menu apps.tables apps.sessions apps.calls apps.analytics apps.websocket -v 1
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
