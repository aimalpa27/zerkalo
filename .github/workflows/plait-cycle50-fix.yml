name: Plait Cycle 50 P0 Fix
on:
  push:
    paths:
      - '.github/workflows/plait-cycle50-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted P0 analytics fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/apps/analytics/views.py')
          s = p.read_text()
          old = "recovery_qs = ServiceRecoveryNote.objects.filter(restaurant_id=rest_id, created_at__gte=start, created_at__lte=end)"
          new = "recovery_qs = ServiceRecoveryNote.objects.filter(restaurant_id=rest_id)\n        if from_date:\n            recovery_qs = recovery_qs.filter(created_at__date__gte=from_date)\n        if to_date:\n            recovery_qs = recovery_qs.filter(created_at__date__lte=to_date)"
          assert old in s, 'expected recovery query not found'
          s = s.replace(old, new, 1)
          old2 = "serious_sla = SLAIncident.objects.filter(restaurant_id=rest_id, breached_at__gte=start, breached_at__lte=end).count()\n        serious_exceptions = OperationalExceptionState.objects.filter(restaurant_id=rest_id, first_seen_at__gte=start, first_seen_at__lte=end).count()"
          new2 = "serious_sla_qs = SLAIncident.objects.filter(restaurant_id=rest_id)\n        serious_exceptions_qs = OperationalExceptionState.objects.filter(restaurant_id=rest_id)\n        if from_date:\n            serious_sla_qs = serious_sla_qs.filter(breached_at__date__gte=from_date)\n            serious_exceptions_qs = serious_exceptions_qs.filter(first_seen_at__date__gte=from_date)\n        if to_date:\n            serious_sla_qs = serious_sla_qs.filter(breached_at__date__lte=to_date)\n            serious_exceptions_qs = serious_exceptions_qs.filter(first_seen_at__date__lte=to_date)\n        serious_sla = serious_sla_qs.count()\n        serious_exceptions = serious_exceptions_qs.count()"
          assert old2 in s, 'expected serious problem query not found'
          p.write_text(s.replace(old2, new2, 1))

          p = Path('frontend/src/lib/api.ts')
          s = p.read_text()
          anchor = "      operations: { active_tables: number; table_utilization_pct: number | null; avg_session_minutes: number; best_hour: null | { hour: number; sessions: number; revenue: number }; best_day: null | { weekday: number; label: string; sessions: number; revenue: number } }\n      upsell:"
          addition = "      operations: { active_tables: number; table_utilization_pct: number | null; avg_session_minutes: number; best_hour: null | { hour: number; sessions: number; revenue: number }; best_day: null | { weekday: number; label: string; sessions: number; revenue: number } }\n      kitchen_sla: any\n      staff_efficiency: any\n      sla_incident_trends: any\n      shift_zone_operations: any\n      daily_digest: any\n      operations_exception_kpi: any\n      service_recovery: any\n      upsell:"
          assert anchor in s, 'analytics type anchor not found'
          p.write_text(s.replace(anchor, addition, 1))

          p = Path('ROADMAP.md')
          s = p.read_text()
          s = s.replace('Full order lifecycle regression | P0 | Critical | L | 1–2d | runtime deps | IN PROGRESS — executable full flow wired into CI; runtime result awaits dependency-capable runner', 'Full order lifecycle regression | P0 | Critical | L | 1–2d | runtime deps | FIX APPLIED 2026-09-20 — Owner analytics date-window crash removed; CI rerun pending')
          p.write_text(s)

          p = Path('FEATURE_CHECKLIST.md')
          s = p.read_text() + "\n\n### Cycle 50 — P0 Full Lifecycle Analytics Fix\n- FIXED (code): Owner Analytics no longer references undefined `start/end`; recovery/SLA/exception coverage uses the same validated `from/to` calendar filters as the rest of Analytics.\n- FIXED (contract): frontend analytics response type now includes operational analytics sections already returned by Django.\n- SAFETY: tenant filters preserved; Guest/Waiter/Kitchen permissions unchanged; AI_ENABLED=false.\n- CI/regression rerun required before Production Ready.\n"
          p.write_text(s)

          p = Path('CHANGELOG_PLAIT.md')
          s = p.read_text()
          entry = "# CHANGELOG_PLAIT.md\n\n## 2026-09-20 — Cycle 50\n\n### Что изменено\n- Исправлен P0 crash Owner Analytics в конце полного ресторанного lifecycle: удалены undefined `start/end`.\n- Service Recovery, SLA и Operations Exception coverage теперь используют единый validated `from/to` date-window и tenant scope.\n- Frontend analytics contract синхронизирован с operational sections Django response.\n- AI_ENABLED=false; внешние AI API не подключались.\n\n### Проверка\n- Изменения минимальные и не меняют Guest/Admin/Manager/Waiter/Kitchen permission boundaries или CRUD/realtime flows.\n- После коммита требуется полный CI: backend regression + frontend typecheck/build + QR→menu→cart→order→admin→kitchen→ready→waiter→served→close→analytics.\n\n"
          assert s.startswith('# CHANGELOG_PLAIT.md\n')
          p.write_text(entry + s[len('# CHANGELOG_PLAIT.md\n\n'):])
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/plait-cycle50-fix.yml
          git config user.name 'plait-ci'
          git config user.email 'plait-ci@users.noreply.github.com'
          git add backend/apps/analytics/views.py frontend/src/lib/api.ts ROADMAP.md FEATURE_CHECKLIST.md CHANGELOG_PLAIT.md .github/workflows/plait-cycle50-fix.yml
          git commit -m 'fix: close P0 analytics lifecycle blockers'
          git push