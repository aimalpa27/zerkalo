name: Plait Cycle 51 Fix
on:
  push:
    paths:
      - '.github/workflows/plait-cycle51-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align analytics contract and docs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/admin/tabs/AnalyticsTab.tsx')
          s=p.read_text()
          old='''  service_recovery: { total: number; compensation_cost: number; serious_problems:number; linked_problems:number; coverage_pct:number|null; previous_total: number | null; previous_compensation_cost: number | null; total_change_pct: number | null; cost_change_pct: number | null; reasons: Array<{ reason: string; count: number; cost: number }>; recent: Array<{ id: string; session_id: string; table_number: number; reason: string; note: string; compensation_type: string; compensation_amount: number; created_at: string }> }\n  upsell:'''
          new='''  service_recovery: { total: number; compensation_cost: number; serious_problems:number; linked_problems:number; coverage_pct:number|null; previous_total: number | null; previous_compensation_cost: number | null; total_change_pct: number | null; cost_change_pct: number | null; reasons: Array<{ reason: string; count: number; cost: number }>; recent: Array<{ id: string; session_id: string; table_number: number; reason: string; note: string; compensation_type: string; compensation_amount: number; created_at: string }> }\n  operations_exception_kpi: { total:number; acknowledged:number; resolved:number; avg_response_minutes:number|null; avg_resolution_minutes:number|null }\n  upsell:'''
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('ROADMAP.md'); s=p.read_text(); s=s.replace('FIX APPLIED 2026-09-20 — Owner analytics date-window crash removed; CI rerun pending','FIX APPLIED 2026-09-20 — analytics runtime/date-window + frontend contract blockers fixed; CI rerun pending'); p.write_text(s)
          p=Path('FEATURE_CHECKLIST.md'); s=p.read_text()+'''\n\n### Cycle 51 — P0 Analytics Runtime/Type Contract\n- FIXED: Cycle 50 patch is now on main; Owner Analytics uses validated from/to date scope.\n- FIXED: Analytics UI contract includes operations_exception_kpi returned by Django.\n- VERIFIED from CI #93 before patch: 13/14 critical backend tests passed; realtime tenant isolation and Kitchen least privilege passed.\n- AI_ENABLED=false; no external AI APIs.\n- Production Ready remains NO until the new CI run is green.\n'''; p.write_text(s)
          p=Path('CHANGELOG_PLAIT.md'); s=p.read_text(); entry='''# CHANGELOG_PLAIT.md\n\n## 2026-09-20 — Cycle 51\n\n### Что изменено\n- Доведён P0 analytics fix из Cycle 50 до main.\n- Добавлен отсутствующий operations_exception_kpi в frontend DjangoSummary contract.\n- Сохранены tenant/role/realtime boundaries; AI_ENABLED=false.\n\n### Проверка\n- Предыдущий CI подтвердил 13/14 critical backend tests; единственный backend blocker был старый analytics crash.\n- Запускается новый полный CI после этого коммита.\n\n'''; assert s.startswith('# CHANGELOG_PLAIT.md\n'); p.write_text(entry+s[len('# CHANGELOG_PLAIT.md\n\n'):])
          PY
      - name: Commit patch
        run: |
          rm .github/workflows/plait-cycle51-fix.yml
          git config user.name plait-ci
          git config user.email plait-ci@users.noreply.github.com
          git add frontend/src/admin/tabs/AnalyticsTab.tsx ROADMAP.md FEATURE_CHECKLIST.md CHANGELOG_PLAIT.md .github/workflows/plait-cycle51-fix.yml
          git commit -m 'fix: complete P0 analytics contract regression'
          git push
